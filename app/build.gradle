plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.stereopano'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.stereopano'
        minSdk 30
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
// Keine Abhaengigkeiten und kein nativer Code -> reines 64-Bit-Java, laeuft auf Android 16.
